name: package-tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - if: runner.os != 'Windows'
        shell: bash
        run: bash -n .agents/skills/bootstrap-agent-env/assets/scripts/agent-env.sh .agents/skills/bootstrap-agent-env/assets/examples/env.sh
